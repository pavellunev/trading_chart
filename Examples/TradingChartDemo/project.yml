name: TradingChartDemo
options:
  bundleIdPrefix: io.github.pavellunev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  TradingChart:
    path: ../..
targets:
  TradingChartDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: TradingChart
        product: TradingChart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pavellunev.TradingChartDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Trading Chart Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
